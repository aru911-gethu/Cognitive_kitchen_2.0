[project]
name = "cognitive-kitchen"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "accelerate>=1.15.0",
    "beautifulsoup4>=4.15.0",
    "chromadb>=1.5.9",
    "faiss-cpu>=1.15.0",
    "fastapi>=0.141.1",
    "langchain>=1.4.0",
    "langchain-community>=0.4.2",
    "langchain-core>=1.6.3",
    "langchain-huggingface>=1.2.2",
    "langchain-openai>=1.6.2",
    "playwright>=1.62.0",
    "pydantic>=2.13.5",
    "pymupdf>=1.28.2",
    "requests>=2.34.2",
    "sentence-transformers>=6.0.1",
    "streamlit>=1.63.0",
    "torch>=2.14.0",
    "torchvision>=0.29.0",
    "transformers>=5.17.0",
    "uvicorn>=0.52.4",
]

[project.scripts]
cognitive-kitchen = "cognitive_kitchen:main"

[build-system]
requires = ["uv_build>=0.12.12,<0.13.0"]
build-backend = "uv_build"
